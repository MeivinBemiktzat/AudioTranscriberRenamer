name: Save NPM README

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  save-readme:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download README
        run: |
          npm view @pitron-ai/yemot-sdk@beta readme > README_FROM_NPM.md

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: npm-readme
          name: NPM README
          files: README_FROM_NPM.md
