name: Build and Release Windows EXE

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Portable Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone EXE with PyInstaller
        shell: pwsh
        run: |
          $buildArgs = @(
            "--noconfirm",
            "--onefile",
            "--windowed",
            "--name=AudioTranscriberRenamer",
            "--collect-all=imageio_ffmpeg",
            "--collect-all=speech_recognition"
          )
          
          if (Test-Path "assets/icon.ico") {
            $buildArgs += "--icon=assets/icon.ico"
            $buildArgs += "--add-data=assets/icon.ico;assets"
          }
          
          $buildArgs += "main.py"
          
          & pyinstaller $buildArgs

      - name: Verify EXE Creation
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/AudioTranscriberRenamer.exe")) {
            Write-Error "dist/AudioTranscriberRenamer.exe was not created!"
            exit 1
          }

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioTranscriberRenamer-Windows
          path: dist/AudioTranscriberRenamer.exe

      - name: Create or Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tagName = "${{ github.ref_name }}"
          $exePath = "dist/AudioTranscriberRenamer.exe"
          
          Write-Host "Creating GitHub Release for tag: $tagName"
          
          gh release create $tagName $exePath `
            --title "Audio Transcriber & Renamer $tagName" `
            --notes "גרסה חדשה של התוכנה מוכנה לשימוש ב-Windows. הורד את הקובץ AudioTranscriberRenamer.exe והפעל." `
            --clobber
