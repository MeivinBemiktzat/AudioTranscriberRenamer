name: Build and Release Windows EXE

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Portable EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Windows Standalone EXE with PyInstaller
        shell: pwsh
        run: |
          $iconArg = ""
          if (Test-Path "assets/icon.ico") {
            $iconArg = "--icon=assets/icon.ico --add-data `"assets/icon.ico;assets`""
          }
          
          Invoke-Expression "pyinstaller --noconfirm --onedir --windowed --onefile $iconArg --name AudioTranscriberRenamer main.py"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioTranscriberRenamer-Windows
          path: dist/AudioTranscriberRenamer.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: dist/AudioTranscriberRenamer.exe
          body: |
            ## Audio Transcriber & Renamer - גרסה ${{ github.ref_name }}
            
            תוכנה עצמאית ל-Windows לתמלול ושינוי שמות קובצי שמע.
            
            ### הוראות הפעלה:
            1. הורד את הקובץ `AudioTranscriberRenamer.exe` המצורף מטה.
            2. הפעל בלחיצה כפולה (אין צורך בהתקנת Python).
