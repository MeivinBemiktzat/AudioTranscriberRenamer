name: Build and Release Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bundle Gemini CLI to Binary
        run: |
          npm install -g @google/generative-ai-cli pkg
          mkdir bundled
          npx pkg --targets node18-win-x64 npx @google/generative-ai-cli --output bundled/gemini.exe
        continue-on-error: true

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "GeminiGUI-Windows-x64" app.py

      - name: Create ZIP Archive
        run: |
          Compress-Archive -Path dist/GeminiGUI-Windows-x64/* -DestinationPath GeminiGUI-Windows-x64.zip

      - name: Upload Artifact (For Manual Runs)
        uses: actions/upload-artifact@v4
        with:
          name: GeminiGUI-Windows-x64
          path: GeminiGUI-Windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: GeminiGUI-Windows-x64.zip
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || 'manual-build' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
