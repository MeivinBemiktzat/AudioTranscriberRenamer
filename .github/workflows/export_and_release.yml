name: Export RDB to Release ZIP

on:
  workflow_dispatch:
    inputs:
      rdb_url:
        description: 'הדבק כאן את הקישור המלא להורדת ה-RDB מ-Upstash'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests rdbtools

      - name: Run RDB Conversion Script
        env:
          RDB_DOWNLOAD_URL: ${{ inputs.rdb_url }}
        run: |
          python convert_rdb.py

      - name: Create ZIP archive
        run: |
          cd exported_json_files
          zip -r ../exported_files.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: exported_files.zip
          tag_name: v1.0.${{ github.run_number }}
          name: Redis Data Export #${{ github.run_number }}
          body: "כל קבצי ה-JSON שהוצאו מקובץ ה-RDB מוכנים להורדה בקובץ ה-ZIP."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
