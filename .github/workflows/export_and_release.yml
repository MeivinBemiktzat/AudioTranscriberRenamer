name: Download RDB and Release ZIP

on:
  workflow_dispatch:
    inputs:
      rdb_url:
        description: 'הדבק כאן את הקישור להורדת ה-RDB מ-Upstash'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run RDB Download Script
        env:
          RDB_DOWNLOAD_URL: ${{ inputs.rdb_url }}
        run: |
          python download_rdb.py

      - name: Create ZIP archive
        run: |
          zip -r rdb_backup.zip dump.rdb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: rdb_backup.zip
          tag_name: v1.0.${{ github.run_number }}
          name: Redis RDB Backup #${{ github.run_number }}
          body: "קובץ ה-dump.rdb המקורי מוכן להורדה בקובץ ה-ZIP."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
